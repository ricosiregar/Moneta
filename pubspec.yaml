name: moneta
description: "Personal money tracker."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # DI & Routing
  get_it: ^9.2.1
  injectable: ^3.0.0
  go_router: ^14.8.0

  # Network & error handling
  dio: ^5.9.2
  dartz: ^0.10.1

  # Model generation (runtime annotations)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Auto-deteksi transaksi notifikasi bank
  notification_listener_service: ^1.0.0

  # Export & Share berkas
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  file_picker: ^11.0.3

  # Local storage sederhana
  shared_preferences: ^2.5.5

  # Backend
  supabase_flutter: ^2.17.2

  # Offline-first local database
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.5.35
  path: ^1.9.1

  # Env & Utilitas
  flutter_dotenv: ^6.0.1
  intl: ^0.20.2
  liquid_glass_widgets: ^1.9.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generators
  build_runner: ^2.5.4
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  injectable_generator: ^3.0.0
  drift_dev: ^2.31.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
